<script>tailwind.config={theme:{extend:{fontFamily:{h:['"Baloo 2"','system-ui','sans-serif'],b:['Nunito','system-ui','sans-serif']}}}}</script>
<style>
body{font-family:Nunito,system-ui,sans-serif;background:#eef2ff;color:#1e1b4b}
h1,h2,h3,.fh{font-family:"Baloo 2",system-ui,sans-serif}
.blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;animation:fl 9s ease-in-out infinite}
@keyframes fl{50%{transform:translate(30px,-25px) scale(1.1)}}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes glow{50%{box-shadow:0 0 0 10px rgba(250,204,21,.0),0 0 28px 6px rgba(250,204,21,.65)}}
@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.pop{animation:pop .3s ease backwards}.rise{animation:rise .45s ease backwards}
.shim{position:relative;overflow:hidden}
.shim::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:sh 2.2s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.glow{animation:glow 2.4s ease-in-out infinite}
.tilt{transition:transform .15s ease-out,box-shadow .2s;transform-style:preserve-3d;will-change:transform}
.tw:hover .tilt{box-shadow:0 24px 40px -12px rgba(79,70,229,.45)}
.btn{transition:transform .12s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.94)}.btn:disabled:hover,.btn:disabled:active{transform:none}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.acc-b>div{overflow:hidden}.acc.open .acc-b{grid-template-rows:1fr}
.acc.open .chev{transform:rotate(180deg)}.chev{transition:transform .3s}
.bar{width:0;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
:focus-visible{outline:3px solid #facc15;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

async function loadRes(){

function animResult(){

}

async function doLogin(e){
 e.preventDefault();const v=$('#nisn').value.trim();let pin='';
 if(!/^(\d{10}|\d{18})$/.test(v)){$('#err').textContent='Siswa: NISN 10 angka. Guru: NIP 18 angka.';$('#nisn').classList.add('border-rose-500');$('#nisn').animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'none'}],{duration:250,iterations:2});return}
 if(API){
  pin=$('#pin').value.trim();if(!/^\d{6}$/.test(pin)){$('#err').textContent='PIN 6 angka dari kartu panitia.';$('#pin').focus();return}
   const btn=$('#lf button');btn.disabled=true;btn.textContent='Mengecek…';
  const r=await api({action:'login',nisn:v,pin});
  btn.disabled=false;btn.textContent='Mulai Memilih';
  if(!r.ok){$('#err').textContent=ERR[r.error]||'Terjadi kesalahan. Coba lagi.';return}
  if(r.paslon!==C.length||r.mpk!==M.length){$('#err').textContent='Jumlah kandidat di halaman dan server tidak sama. Hubungi panitia.';return}
   S.me=r;if(r.voted)S.voted[v]=-1;else delete S.voted[v];
 }
 S.nisn=v;S.pin=pin;S.view='vote';tab='vote';S.pick={o:null,m:null};RISE='rise';render();setTimeout(()=>RISE='',1000);
 if(hasVoted())toast('Nomor ini sudah memilih. Satu suara per pemilih.');else toast(S.me?'Selamat datang, '+S.me.nama+'! 🎉':'Selamat datang! Pilih paslon favoritmu 🎉');
}

function openM(html){md.innerHTML=html;md.classList.remove('hidden');md.classList.add('flex');const b=md.querySelector('button');if(b)b.focus()}
function closeM(){md.classList.add('hidden');md.classList.remove('flex')}
const box=(inner,w='max-w-lg')=>`<div class="pop bg-white rounded-3xl w-full ${w} max-h-[90vh] overflow-auto p-5 md:p-7 relative" data-act="stop">
 <button data-act="close" aria-label="Tutup" class="btn absolute top-3 right-3 w-9 h-9 rounded-full bg-indigo-100 text-indigo-800 font-bold">✕</button>${inner}</div>`;

function visiModal(c){
 const item=(t,b,o)=>`<div class="acc ${o?'open':''} border-2 border-indigo-100 rounded-2xl mb-2 overflow-hidden"><button data-act="acc" class="w-full flex justify-between items-center px-4 py-3 font-bold text-left bg-indigo-50"><span>${t}</span><span class="chev">▾</span></button><div class="acc-b"><div><p class="px-4 py-3">${b}</p></div></div></div>`;
 openM(box(`<div class="flex items-center gap-3 mb-4"><div class="w-14 h-14 rounded-2xl bg-gradient-to-br ${c.g} flex items-center justify-center text-3xl">${c.e}</div><div><h3 class="text-2xl font-extrabold">${nmH(c)}</h3><p class="text-indigo-600 font-bold">"${c.s}"</p></div></div>
 ${item('🎯 Visi',c.visi,1)}${c.misi.map((m,i)=>item('Misi '+(i+1),m)).join('')}${item('📌 Program unggulan',Object.entries(c.p).map(([k,v])=>`<b>${k}:</b> ${v}`).join('<br>'))}`));
}
function compareModal(k){
 const L=E(k);
 openM(box(`<h3 class="text-2xl font-extrabold mb-1">Bandingkan ${k==='m'?'Calon Ketua MPK':'Paslon OSIS'}</h3><p class="text-slate-500 mb-4">Program kerja utama berdampingan.</p>
 <div class="overflow-x-auto"><div class="grid min-w-[620px] gap-2" style="grid-template-columns:90px repeat(3,1fr)">
  <div></div>${L.map(c=>`<div class="rounded-2xl p-3 text-center text-white font-extrabold bg-gradient-to-br ${c.g}"><div class="text-3xl">${c.e}</div>${nmH(c)}</div>`).join('')}
  <div class="font-bold self-center">Visi</div>${L.map(c=>`<div class="bg-indigo-50 rounded-xl p-3 text-sm">${c.visi}</div>`).join('')}
  ${Object.keys(L[0].p).map(k=>`<div class="font-bold self-center">${k}</div>`+L.map(c=>`<div class="bg-indigo-50 hover:bg-yellow-100 transition rounded-xl p-3 text-sm">${c.p[k]}</div>`).join('')).join('')}
 </div></div>`,'max-w-4xl'));
}
function fotoModal(c){
 openM(box(`<h3 class="text-xl font-extrabold mb-3">Foto ${esc(c.n)}</h3>
 <div class="rounded-2xl overflow-hidden bg-gradient-to-br ${c.g} flex items-center justify-center min-h-[12rem] text-white font-bold p-1">
  <img src="${esc(c.foto)}" alt="Foto ${esc(c.n)}" class="w-full max-h-[70vh] object-contain" onerror="this.replaceWith(document.createTextNode('Foto belum tersedia'))">
 </div>`));
}
function reviewModal(){
 const p=S.pick;if(p.o==null||p.m==null)return;const o=C[p.o],m=M[p.m];
 const row=(t,c)=>`<div class="flex items-center gap-3 bg-indigo-50 rounded-2xl p-3"><span class="text-4xl">${c.e}</span><div><p class="text-xs font-bold text-indigo-500">${t}</p><p class="font-extrabold">${nmH(c)}</p></div></div>`;
 openM(box(`<div class="text-center"><h3 class="text-2xl font-extrabold">Cek dulu pilihanmu ya!</h3>
 <div class="grid gap-3 mt-4 text-left">${row('KETUA & WAKIL OSIS',o)}${row('KETUA MPK',m)}</div>
 <p class="text-slate-600 mt-3">Pilihan tidak bisa diubah setelah dikirim.</p>
 <div class="grid grid-cols-2 gap-3 mt-4"><button data-act="close" class="btn py-3 rounded-xl bg-slate-200 font-bold">Belum, kembali</button>
 <button data-act="yes" class="btn py-3 rounded-xl bg-indigo-600 text-white font-extrabold shadow-md">Ya, kirim suara</button></div></div>`));
}
async function doVote(){
 const p=S.pick;if(hasVoted()||S.busy||p.o==null||p.m==null)return;
 if(API){
  S.busy=1;openM(box(`<div class="text-center py-6"><div class="text-5xl" style="animation:wob 1s infinite">📨</div><p class="font-bold mt-3">Mengirim suaramu…</p></div>`));
  const r=await api({action:'vote',nisn:S.nisn,pin:S.pin,paslon:p.o+1,mpk:p.m+1});S.busy=0;
  if(!r.ok&&r.error==='SUDAH_MEMILIH'){S.voted[S.nisn]=-1;closeM();render();toast('Suaramu sudah tercatat sebelumnya.');return}
  if(!r.ok){closeM();toast(ERR[r.error]||'Gagal mengirim. Coba lagi.');return}
 }else{S.votes.o[p.o]++;S.votes.m[p.m]++}
 S.voted[S.nisn]={o:p.o,m:p.m};save();closeM();render();confetti();
 openM(box(`<div class="text-center"><div class="text-6xl" style="animation:wob 1s 2">🎉</div><h3 class="text-3xl font-extrabold mt-2">Terima Kasih Sudah Memilih!</h3>
 <p class="text-slate-600 mt-2">Suaramu untuk <b>${C[p.o].n}</b> (OSIS) dan <b>${M[p.m].n}</b> (MPK) sudah tercatat.</p>
 <button data-act="close" class="btn mt-5 px-6 py-3 rounded-xl bg-yellow-300 text-indigo-900 font-extrabold">Selesai</button></div>`));
}

/* confetti */
const cv=$('#cv'),cx=cv.getContext('2d');let P=[];
function sz(){cv.width=innerWidth;cv.height=innerHeight}sz();addEventListener('resize',sz);
function confetti(){
 const cols=['#facc15','#6366f1','#3b82f6','#a855f7','#f472b6','#34d399'];
 for(let b=0;b<3;b++){const x=innerWidth*(.2+b*.3);for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,v=4+Math.random()*9;P.push({x,y:innerHeight*.45,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,c:cols[i%6],s:5+Math.random()*6,r:Math.random()*6,l:110})}}
 if(P.length<=210)loop();
}
function loop(){
 cx.clearRect(0,0,cv.width,cv.height);
 P=P.filter(p=>p.l>0);
 P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.99;p.r+=.2;p.l--;cx.save();cx.globalAlpha=Math.min(1,p.l/30);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});
 if(P.length)requestAnimationFrame(loop);else cx.clearRect(0,0,cv.width,cv.height);
}

/* events */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act,id=+el.dataset.id,k=el.dataset.k||'o',c=E(k)[id];
 if(a==='stop')return;
 if(a==='close'){if(el===md&&e.target!==md)return;closeM()}
 else if(a==='tab'){tab=el.dataset.id;render();if(tab==='result')loadRes()}
 else if(a==='logout'){S.pick={o:null,m:null};RISE='rise';S.view='login';S.nisn='';S.pin='';if(API)S.voted={};S.me=null;S.key='';S.res=null;tab='vote';render()}
 else if(a==='visi')visiModal(c);
 else if(a==='compare')compareModal(k);
 else if(a==='foto'&&c.foto)fotoModal(c);
 else if(a==='pick'){S.pick[k]=S.pick[k]===id?null:id;render();if(k==='o'&&S.pick.o!=null&&S.pick.m==null){const t=$('#mpk');if(t)t.scrollIntoView({behavior:'smooth'})}}
 else if(a==='review')reviewModal();
 else if(a==='yes')doVote();
 else if(a==='acc')el.parentElement.classList.toggle('open');
 else if(a==='sim'){for(let i=0;i<10;i++){S.votes.o[Math.floor(Math.random()*3)]++;S.votes.m[Math.floor(Math.random()*3)]++}save();render()}
 else if(a==='reset'){S.votes={o:[12,9,7],m:[10,11,7]};S.voted={};S.pick={o:null,m:null};save();toast('Data demo direset');render()}
});
addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
render();
</script>
</body>
</html>
